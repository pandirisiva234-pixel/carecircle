name: CareCircle 15-Minute Reminders & Escalations Cron

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  # Allows manual execution from the GitHub Actions tab
  workflow_dispatch:

jobs:
  trigger-reminders:
    name: Call Reminders & Escalation Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "::error::APP_URL repository secret is not set!"
            exit 1
          fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET repository secret is not set!"
            exit 1
          fi

      - name: Trigger Reminders Cron
        run: |
          # Strip trailing slash from APP_URL if present
          CLEAN_APP_URL="$(echo "${{ secrets.APP_URL }}" | sed 's:/*$::')"
          TARGET_URL="${CLEAN_APP_URL}/api/cron/reminders"
          
          echo "Triggering reminders cron at: ${TARGET_URL}"
          
          RESPONSE=$(curl -s -S -X POST "${TARGET_URL}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP_STATUS:%{http_code}")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          
          echo "Response Body:"
          echo "$HTTP_BODY"
          echo "HTTP Status Code: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Cron endpoint returned non-200 status code: $HTTP_STATUS"
            exit 1
          fi
